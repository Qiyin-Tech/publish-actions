name: Publish Pack-backed Docker application

on:
  workflow_call:
    inputs:
      pack:
        description: Nomad Pack name; never inferred from the caller repository
        required: true
        type: string
      rc_branch:
        description: Selected release/vX.Y.Z branch
        required: false
        type: string
        default: ''
      build_args:
        description: Newline-delimited Docker build arguments
        required: false
        type: string
        default: ''
      cache_mode:
        description: BuildKit cache export mode (registry, inline, or none)
        required: false
        type: string
        default: registry
      cache_tag:
        description: Registry tag used as the BuildKit cache source
        required: false
        type: string
        default: buildcache
      release_asset_source:
        description: Optional formal-release environment example file
        required: false
        type: string
        default: ''
    secrets:
      ACR_PASSWORD:
        description: Password for vars.ACR_USERNAME at vars.ACR_ENDPOINT
        required: true
      NOMAD_PACKS_APP_CLIENT_ID:
        description: GitHub App client ID allowed to dispatch nomad-packs workflows
        required: true
      NOMAD_PACKS_APP_PRIVATE_KEY:
        description: GitHub App private key allowed to dispatch nomad-packs workflows
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-pack-docker-${{ github.repository }}-${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref_name == inputs.rc_branch && 'rc' || github.ref_type == 'tag' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' || github.ref_name == inputs.rc_branch }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      github.ref_name == 'dev' ||
      github.ref_name == inputs.rc_branch
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Publish application
        uses: $/actions/publish-pack-docker
        with:
          pack: ${{ inputs.pack }}
          rc_branch: ${{ inputs.rc_branch }}
          build_args: ${{ inputs.build_args }}
          cache_mode: ${{ inputs.cache_mode }}
          cache_tag: ${{ inputs.cache_tag }}
          release_asset_source: ${{ inputs.release_asset_source }}
          acr_endpoint: ${{ vars.ACR_ENDPOINT }}
          acr_username: ${{ vars.ACR_USERNAME }}
          acr_password: ${{ secrets.ACR_PASSWORD }}
          nomad_packs_app_client_id: ${{ secrets.NOMAD_PACKS_APP_CLIENT_ID }}
          nomad_packs_app_private_key: ${{ secrets.NOMAD_PACKS_APP_PRIVATE_KEY }}
