name: Publish Docker application

on:
  workflow_call:
    inputs:
      pack:
        description: Nomad Pack name; never inferred from the caller repository
        required: true
        type: string
      rc_branch:
        description: Selected release/vX.Y.Z branch
        required: false
        type: string
        default: ''
      build_args:
        description: Newline-delimited Docker build arguments
        required: false
        type: string
        default: ''
      cache_mode:
        description: BuildKit cache export mode (registry, inline, or none)
        required: false
        type: string
        default: registry
      cache_tag:
        description: Registry tag used as the BuildKit cache source
        required: false
        type: string
        default: buildcache
      release_asset_source:
        description: Optional formal-release environment example file
        required: false
        type: string
        default: ''
    secrets:
      ACR_PASSWORD:
        description: Password for vars.ACR_USERNAME at vars.ACR_ENDPOINT
        required: true
      NOMAD_PACKS_APP_CLIENT_ID:
        description: GitHub App client ID allowed to dispatch nomad-packs workflows
        required: true
      NOMAD_PACKS_APP_PRIVATE_KEY:
        description: GitHub App private key allowed to dispatch nomad-packs workflows
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-docker-${{ github.repository }}-${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref_name == inputs.rc_branch && 'rc' || github.ref_type == 'tag' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' || github.ref_name == inputs.rc_branch }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      github.ref_name == 'dev' ||
      github.ref_name == inputs.rc_branch
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Publish Docker image to GHCR
        id: publish
        uses: $/actions/publish-docker
        with:
          rc_branch: ${{ inputs.rc_branch }}
          build_args: ${{ inputs.build_args }}
          cache_mode: ${{ inputs.cache_mode }}
          cache_tag: ${{ inputs.cache_tag }}

      - name: Sync published image to ACR
        if: ${{ steps.publish.outputs.published == 'true' }}
        uses: Qiyin-Tech/acr-sync@v2
        with:
          source: ${{ steps.publish.outputs.image }}
          tag: ${{ steps.publish.outputs.image_tag }}
          arch: amd64
          target_namespace: qiyin
          source_username: ${{ github.actor }}
          source_password: ${{ github.token }}
          acr_endpoint: ${{ vars.ACR_ENDPOINT }}
          acr_username: ${{ vars.ACR_USERNAME }}
          acr_password: ${{ secrets.ACR_PASSWORD }}

      - name: Create or update GitHub Release
        if: ${{ steps.publish.outputs.kind == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACK: ${{ inputs.pack }}
          RELEASE_ASSET_SOURCE: ${{ inputs.release_asset_source }}
          TAG: ${{ steps.publish.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          if [[ -n "${RELEASE_ASSET_SOURCE}" ]]; then
            if [[ ! -f "${RELEASE_ASSET_SOURCE}" ]]; then
              echo "Release asset source does not exist: ${RELEASE_ASSET_SOURCE}" >&2
              exit 1
            fi
            asset="${RUNNER_TEMP}/${PACK}-${TAG}.env.example"
            cp "${RELEASE_ASSET_SOURCE}" "${asset}"
            assets+=("${asset}")
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if ((${#assets[@]})); then
              gh release upload "${TAG}" "${assets[@]}" --clobber
            fi
          else
            gh release create "${TAG}" "${assets[@]}" --generate-notes
          fi

      - name: Update Nomad Pack
        if: ${{ steps.publish.outputs.published == 'true' }}
        uses: $/actions/update-pack
        with:
          pack: ${{ inputs.pack }}
          version: ${{ steps.publish.outputs.image_tag }}
          channel: ${{ steps.publish.outputs.kind == 'rc' && 'rc' || 'dev' }}
          mode: ${{ steps.publish.outputs.kind == 'release' && 'release' || 'moving' }}
          guard_ref: ${{ (steps.publish.outputs.kind == 'dev' || steps.publish.outputs.kind == 'rc') && github.ref_name || '' }}
          app_client_id: ${{ secrets.NOMAD_PACKS_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.NOMAD_PACKS_APP_PRIVATE_KEY }}
