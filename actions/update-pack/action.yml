name: Update Nomad Pack
description: Update a Nomad Pack branch and optionally tag the resulting commit

inputs:
  app_client_id:
    description: Non-secret GitHub App client ID used to access nomad-packs
    required: true
  app_private_key:
    description: GitHub App private key used to create a short-lived installation token
    required: true
  pack:
    description: Pack directory name under nomad-packs/packs; never inferred from the source repository
    required: true
  version:
    description: Published image or artifact tag written as the Pack version and default reference tag
    required: true
  branch:
    description: Pack branch to update (dev or rc)
    required: true
  tag:
    description: Whether to create the <pack>/<version> Git tag on the updated Pack commit
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Create Nomad Packs App token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app_client_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: Qiyin-Tech
        repositories: nomad-packs
        permission-actions: write

    - name: Validate and dispatch Pack update
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SOURCE_GH_TOKEN: ${{ github.token }}
        PACK: ${{ inputs.pack }}
        VERSION: ${{ inputs.version }}
        BRANCH: ${{ inputs.branch }}
        TAG: ${{ inputs.tag }}
        GIT_NAME: ${{ github.actor }}
        GIT_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH}/scripts/dispatch-pack-update"
