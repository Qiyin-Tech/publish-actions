name: Publish Docker package
description: Build and optionally publish one linux/amd64 Docker package to GHCR

inputs:
  # Image identity
  package:
    description: Explicit GHCR package name under the caller repository owner
    required: true
  tags:
    description: Newline-delimited Docker tags without a registry or package prefix
    required: true

  # Build definition
  context:
    description: Build context whose files are available to Dockerfile COPY and ADD instructions
    required: false
    default: .
  file:
    description: Dockerfile path
    required: false
    default: ./Dockerfile
  target:
    description: Optional Docker build target
    required: false
    default: ''
  build_args:
    description: Newline-delimited values for Dockerfile ARG instructions; do not use for secrets
    required: false
    default: ''

  # BuildKit cache
  cache_from:
    description: Newline-delimited BuildKit cache import entries
    required: false
    default: ''
  cache_to:
    description: Newline-delimited BuildKit cache export entries
    required: false
    default: ''

  # Publication
  push:
    description: Whether to publish the image to GHCR
    required: false
    default: 'true'
  token:
    description: GitHub token with packages write permission
    required: true

outputs:
  image:
    description: Complete GHCR image name without a tag
    value: ${{ steps.metadata.outputs.image }}
  references:
    description: Newline-delimited complete GHCR image references
    value: ${{ steps.metadata.outputs.references }}
  digest:
    description: Published image digest; empty when the build is not pushed
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Prepare GHCR references
      id: metadata
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OWNER: ${{ github.repository_owner }}
        PACKAGE: ${{ inputs.package }}
        TAGS: ${{ inputs.tags }}
        PUSH: ${{ inputs.push }}
      run: bash "${ACTION_PATH}/scripts/prepare-references"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and optionally publish image
      id: build
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        target: ${{ inputs.target }}
        platforms: linux/amd64
        push: ${{ inputs.push }}
        tags: ${{ steps.metadata.outputs.references }}
        build-args: ${{ inputs.build_args }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: ${{ inputs.cache_from }}
        cache-to: ${{ inputs.cache_to }}
